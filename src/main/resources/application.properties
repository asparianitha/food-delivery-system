spring.application.name=FoodDelivery

# H2 Database - No Password Needed, Will Work 100%
spring.datasource.url=jdbc:h2:mem:fooddelivery_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA - This will create tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Server Port
server.port=8080

# H2 Console - To see database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fixed Login - So password does not change every time
spring.security.user.name=admin
spring.security.user.password=admin123
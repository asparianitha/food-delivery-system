<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial; text-align:center;">
<h1 style="color:orange;">Add Food</h1>
<form th:action="@{/foods/save}" th:object="${food}" method="post">
Name: <input type="text" th:field="*{name}"><br><br>
Price: <input type="number" step="0.01" th:field="*{price}"><br><br>
Category: <input type="text" th:field="*{category}"><br><br>
<button type="submit">Save</button>
</form>
<br><a href="/foods">Back to List</a>
</body>
</html>
